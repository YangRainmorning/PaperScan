name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore --nologo

      - name: Build
        run: dotnet build -c Release --no-restore --nologo

      - name: Test
        run: >-
          dotnet test -c Release --no-build --nologo
          --logger "trx;LogFileName=results.trx"
          --results-directory artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts
          if-no-files-found: ignore

  package:
    name: package (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >-
          dotnet publish src/PaperScan.Cli/PaperScan.Cli.csproj
          -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false -o out --nologo

      - name: The published binary must at least answer --version and --help
        run: |
          ./out/paperscan --version
          ./out/paperscan --help
          ./out/paperscan --not-a-real-option && exit 1 || test $? -eq 2

  web:
    name: web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

      - name: The built site must stay small enough to open instantly on a phone
        run: |
          set -euo pipefail
          total=$(du -sb dist | cut -f1)
          echo "dist is $total bytes"
          if [ "$total" -gt 200000 ]; then
            echo "::error::the web build grew past 200 KB; it is meant to open instantly on a phone"
            exit 1
          fi

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: paperscan-web
          path: web/dist
          if-no-files-found: error
